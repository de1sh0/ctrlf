services:
  - type: web
    name: paisa-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paisa-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      # Set these after you know your Vercel URL (Step 2)
      - key: FRONTEND_URL
        sync: false   # e.g. https://paisa-xyz.vercel.app
      - key: BACKEND_URL
        sync: false   # e.g. https://paisa-backend.onrender.com
      # SMTP (Gmail App Password)
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Google OAuth credentials (from console.cloud.google.com)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Groq LLM API key
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: paisa-db
    plan: free
    databaseName: paisa_db
