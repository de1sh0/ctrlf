services:
  - type: web
    name: paisa-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paisa-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: FRONTEND_URL
        sync: false   # Set this to your Vercel URL after deployment
      - key: GROQ_API_KEY
        sync: false   # Add your Groq API key in Render dashboard
      - key: SMTP_USERNAME
        sync: false   # Your Gmail address for sending emails
      - key: SMTP_PASSWORD
        sync: false   # Your Gmail App Password (NOT regular password)

databases:
  - name: paisa-db
    plan: free
    databaseName: paisa_db
